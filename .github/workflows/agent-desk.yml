# Builds the Agent Desk installers: Windows (.exe, Electron) and Android (.apk, Capacitor).
# Artifacts: Actions -> run -> "AgentDesk-Windows" / "AgentDesk-Android".
# A tag like agent-desk-v2.2.0 also publishes them as the GitHub Release "Agent Desk 2.2.0",
# the notes come from the "## 2.2.0" section of CHANGELOG.md.
name: Agent Desk

on:
  push:
    branches: [main]
    tags: ["agent-desk-v*"]
    paths: ["agent-desk/**", ".github/workflows/agent-desk.yml"]
  pull_request:
    paths: ["agent-desk/**", ".github/workflows/agent-desk.yml"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: agent-desk

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Core tests
        run: node --test --test-reporter=spec core/test/desk.test.js
      - name: Cyrillic pixel font is up to date
        run: node scripts/make-font.js --check
      - name: Syntax of the window, phone and build scripts
        run: for f in web/*.js desktop/*.js core/*.js scripts/*.js mobile/scripts/*.js; do node --check "$f" || exit 1; done

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Win98 look (98.css + icons)
        run: node scripts/fetch-assets.js
      - name: Install Electron
        run: npm install --no-audit --no-fund
      - name: Build installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: AgentDesk-Windows
          path: agent-desk/dist/*.exe
          if-no-files-found: error

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Win98 look (98.css + icons)
        run: node scripts/fetch-assets.js
      - name: Capacitor project
        working-directory: agent-desk/mobile
        run: |
          npm install --no-audit --no-fund
          npm run web
          npx cap add android
          npx capacitor-assets generate --android || echo "::warning::app icons were not generated, the default icon is used"
          node scripts/patch-android.js
          npx cap sync android
      - name: Same signature for every build (optional secret ANDROID_DEBUG_KEYSTORE)
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "keystore from secret"
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE is not set: each build is signed with a new key, updating needs uninstall first"
          fi
      - name: Build APK
        working-directory: agent-desk/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: |
          v=$(node -p "require('./mobile/package.json').version")
          mkdir -p dist
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "dist/AgentDesk-$v.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: AgentDesk-Android
          path: agent-desk/dist/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/agent-desk-v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Release name and notes from CHANGELOG.md
        working-directory: .
        run: |
          v="${GITHUB_REF_NAME#agent-desk-v}"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          awk -v v="$v" '/^## /{p = index($0, "## " v " ") == 1; next} p' CHANGELOG.md > notes.md
          printf '\nФайлы: AgentDesk-Setup-%s.exe для Windows и AgentDesk-%s.apk для Android. Как установить и подключить телефон: [README](https://github.com/purrfect0/AgentDesk#readme).\n' "$v" "$v" >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Agent Desk ${{ env.VERSION }}
          body_path: notes.md
          files: out/*
